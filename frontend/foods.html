<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Surplus Food | FoodRescue Lite</title>
  <meta name="description" content="A lightweight surplus-food coordination platform connecting providers with recipients to reduce food wastage.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="container">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.4rem;">
          Find Surplus Food
        </h1>
        <p style="color: var(--text-muted); font-size: 1.05rem;">
          Browse available safe surplus food from nearby providers and claim it before the collection deadline.
        </p>
      </div>

      <!-- Search & Filter Controls -->
      <div class="filter-bar">
        <div class="filter-grid">
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="search-input">Search Food or Location</label>
            <input type="text" id="search-input" class="form-control" placeholder="Search by name, location, or tag..." oninput="debounceSearch()">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="category-filter">Category</label>
            <select id="category-filter" class="form-control" onchange="loadFoods()">
              <option value="">All Categories</option>
              <option value="Meals">Meals</option>
              <option value="Snacks">Snacks</option>
              <option value="Bakery">Bakery</option>
              <option value="Fruits">Fruits</option>
              <option value="Vegetables">Vegetables</option>
              <option value="Beverages">Beverages</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="veg-filter">Dietary</label>
            <select id="veg-filter" class="form-control" onchange="loadFoods()">
              <option value="">All Dietary</option>
              <option value="true">🌱 Vegetarian Only</option>
              <option value="false">🍗 Non-Vegetarian</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="status-filter">Status</label>
            <select id="status-filter" class="form-control" onchange="loadFoods()">
              <option value="AVAILABLE">Available Only</option>
              <option value="ALL">Show All Statuses</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Grid of Food Cards -->
      <div id="foods-container" class="food-grid"></div>
    </div>
  </main>

  <!-- Claim Confirmation Modal -->
  <div id="claim-modal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Confirm Food Claim</h3>
        <button class="modal-close" onclick="closeClaimModal()">&times;</button>
      </div>
      <div>
        <p>Are you sure you want to claim this surplus food?</p>
        <div id="modal-food-desc"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeClaimModal()">Cancel</button>
        <button id="confirm-claim-btn" class="btn btn-primary" onclick="confirmClaim()">Confirm Claim</button>
      </div>
    </div>
  </div>


  <footer class="site-footer">
    <div class="container footer-content">
      <div style="display: flex; align-items: center; gap: 0.5rem; font-weight: 700; color: var(--text-main);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px; color: var(--primary);">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>FoodRescue Lite</span>
      </div>
      <p class="footer-text">Lightweight Surplus Food Coordination Platform &copy; 2026. Reducing food waste together.</p>
    </div>
  </footer>

  <div id="toast-container" class="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>

  <script src="/js/foods.js"></script>
  <script>
    let debounceTimer;
    function debounceSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadFoods, 300);
    }
    document.addEventListener('DOMContentLoaded', loadFoods);
  </script>
</body>
</html>
